---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  namespace: work
  labels:
    app: &app test
    version: &version v1.27.5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: *app
      version: *version
  template:
    metadata:
      labels:
        app: *app
        version: *version
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: app-config
      containers:
        - name: main
          image: busybox:1.28
          command:
            - 'sh'
            - '-c'
            - 'tail -f /dev/null'
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 100Mi
              cpu: 100m
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config

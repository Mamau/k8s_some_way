# 1. Под-писатель (writer)
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-writer
  labels:
    app: hostpath-share
spec:
  containers:
    - name: main
      image: busybox:1.37
      command:
        - "sh"
        - "-c"
      args:
        - |
          while true; do
            echo "Writer say hello at $(date)" >> /data/shared.log;
            sleep 5;
          done
      volumeMounts:
        - name: shared-data
          mountPath: /data
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
  volumes:
    - name: shared-data
      hostPath:
        path: /tmp/k8s-book-shared
        type: DirectoryOrCreate
---
# 2. Под-читатель (reader)
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-reader
spec:
  # Гарантируем запуск на том же узле, что и writer
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - hostpath-share
          topologyKey: kubernetes.io/hostname
  containers:
    - name: reader
      image: busybox:1.37
      command:
        - "sh"
        - "-c"
      args:
        - |
          while [ ! -f /data/shared.log ]; do sleep 2; done;
          tail -f /data/shared.log
      volumeMounts:
        - name: shared-data
          mountPath: /data
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
  volumes:
    - name: shared-data
      hostPath:
        path: /tmp/k8s-book-shared
        type: DirectoryOrCreate

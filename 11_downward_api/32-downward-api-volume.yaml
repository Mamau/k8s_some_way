---
apiVersion: v1
kind: Pod
metadata:
  name: downward-api-volume-demo
  labels:
    app.kubernetes.io/name: downward-volume-demo
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
  annotations:
    author: "mamau"
spec:
  volumes:
    - name: podinfo
      downwardAPI:
        items:
          # Pod fields
          - path: "pod_name"
            fieldRef:
              fieldPath: metadata.name
          - path: "pod_namespace"
            fieldRef:
              fieldPath: metadata.namespace
          - path: "labels"
            fieldRef:
              fieldPath: metadata.labels
          - path: "annotations"
            fieldRef:
              fieldPath: metadata.annotations
          # Container Fields
          - path: "cpu_limit"
            resourceFieldRef:
              containerName: main-container
              resource: limits.cpu
              divisor: "1"
          - path: "memory_limit"
            resourceFieldRef:
              containerName: main-container
              resource: limits.memory
              divisor: 1Mi
  containers:
    - name: main-container
      image: busybox:1.37
      command:
        - "sh"
        - "-c"
      args:
        - |
          echo "---";
          echo "Pod Name: $POD_NAME";
          echo "Pod NameSpace: $POD_NAMESPACE";
          echo "Labels:
          $(cat /etc/podinfo/labels)
          ";
          echo "Annotations:
          $(cat /etc/podinfo/annotations)
          ";
          echo "CPU Limit: $(cat /etc/podinfo/cpu_limit)";
          echo "Memory Limit: $(cat /etc/podinfo/memory_limit)";
          sleep infinity
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      volumeMounts:
        - name: podinfo
          mountPath: /etc/podinfo
  restartPolicy: Never
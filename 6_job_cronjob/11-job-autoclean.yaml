---
apiVersion: batch/v1
kind: Job
metadata:
  name: myjob-autoclean
  labels:
    app.kubernetes.io/name: myjob-autoclean
    app.kubernetes.io/version: v0.0.1
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test-job
          image: busybox:1.28
          command:
            - 'sh'
            - '-c'
            - 'echo "Test job running"... && sleep 10 && exit 0'
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"